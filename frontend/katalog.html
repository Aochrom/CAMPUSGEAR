<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Katalog peralatan yang tersedia untuk dipinjam di CAMPUSGEAR">
  <title>CAMPUSGEAR | Katalog</title>
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="/">CAMPUSGEAR</a>
      <nav aria-label="Navigasi Utama">
        <a href="/">Beranda</a>
        <a href="/katalog.html" class="aktif">Katalog</a>
        <a href="/peminjaman.html">Peminjaman</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <h1>Katalog Peralatan</h1>
      <p class="subtitle">Cari dan filter peralatan yang tersedia untuk dipinjam.</p>

      <section aria-label="Pencarian dan Filter">
        <div class="kontrol-katalog">
          <label for="cari-nama" class="sr-only">Cari peralatan</label>
          <input
            type="search"
            id="cari-nama"
            name="cari-nama"
            placeholder="Cari nama peralatan…"
            autocomplete="off"
            aria-label="Cari peralatan berdasarkan nama"
          >

          <label for="filter-kategori" class="sr-only">Filter kategori</label>
          <select id="filter-kategori" name="filter-kategori" aria-label="Filter berdasarkan kategori">
            <option value="">Semua kategori</option>
          </select>

          <label for="urutan-nama" class="sr-only">Urutan</label>
          <select id="urutan-nama" name="urutan-nama" aria-label="Urutan nama">
            <option value="az">Nama A–Z</option>
            <option value="za">Nama Z–A</option>
          </select>

          <label class="checkbox-label" for="filter-tersedia">
            <input type="checkbox" id="filter-tersedia" name="filter-tersedia">
            Stok tersedia saja
          </label>
        </div>
      </section>

      <section aria-labelledby="judul-katalog">
        <h2 id="judul-katalog" class="sr-only">Daftar Peralatan</h2>

        <div class="katalog-grid" id="katalog-grid" role="list" aria-live="polite">
          <!-- nanti diisi oleh JS -->
        </div>

        <p id="katalog-kosong" class="katalog-kosong" hidden aria-live="assertive">
          Peralatan tidak ditemukan.
        </p>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <p>2026 CAMPUSGEAR &mdash; Ujian Tengah Semester Mata Kuliah Komputasi Berbasis Web</p>
  </footer>

  <script src="/src/main.js"></script>

</body>
</html>
